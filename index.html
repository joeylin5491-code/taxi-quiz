<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計程車執登聽題寶 - 北北基桃宜</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.4rem; color: #f59e0b; margin-bottom: 8px; }
    
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    select {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      background-color: #334155;
      color: #fff;
      border: 1px solid #475569;
      font-size: 1rem;
      font-weight: bold;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .badge-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .badge {
      background-color: #3b82f6;
      color: #fff;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .badge.type { background-color: #8b5cf6; }
    
    .question-text {
      font-size: 1.3rem;
      line-height: 1.6;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f8fafc;
    }
    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .option-item {
      background-color: #334155;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      border: 2px solid transparent;
    }
    .option-item.correct { border-color: #22c55e; background-color: #064e3b; }
    .explanation {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #cbd5e1;
      border-left: 4px solid #f59e0b;
      margin-top: auto;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      background-color: #3b82f6;
    }
    button:active { opacity: 0.8; }
    button.secondary { background-color: #475569; }
    button.warning { background-color: #d97706; }
    button.active { background-color: #22c55e; }
  </style>
</head>
<body>

  <header>
    <h1>🚖 計程車執登聽題寶</h1>
    
    <div class="filter-bar">
      <select id="region-select" onchange="filterQuestions()">
        <option value="ALL">全部考區 (北北基桃宜)</option>
        <option value="北北基">北北基考區</option>
        <option value="桃園">桃園考區</option>
        <option value="宜蘭">宜蘭考區</option>
        <option value="通用法規">全國通用法規</option>
      </select>
      <select id="type-select" onchange="filterQuestions()">
        <option value="ALL">全部題型</option>
        <option value="是非題">是非題</option>
        <option value="選擇題">選擇題</option>
      </select>
    </div>

    <div class="status-bar">
      <span id="category-name">分類：載入中...</span>
      <span id="progress-text">0 / 0</span>
    </div>
  </header>

  <div class="card">
    <div class="badge-group">
      <span class="badge" id="region-badge">考區</span>
      <span class="badge type" id="type-badge">題型</span>
    </div>
    <div class="question-text" id="question">題目載入中...</div>
    <ul class="options-list" id="options"></ul>
    <div class="explanation" id="explanation" style="display:none;"></div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="warning" id="play-btn" onclick="togglePlay()">▶ 自動朗讀</button>
      <button class="secondary" id="stt-btn" onclick="startSTT()">🎙️ 語音答題</button>
    </div>
    <div class="btn-group">
      <button class="secondary" onclick="prevQuestion()">⏮️ 上一題</button>
      <button onclick="nextQuestion()">下一題 ⏭️</button>
    </div>
  </div>

  <script>
    const masterQuestionBank = [
      {
        id: 1,
        region: "北北基",
        type: "是非題",
        category: "地理環境",
        question: "臺北市「臺北榮民總醫院」位於石牌路二段上。",
        options: ["1. 對 (O)", "2. 錯 (X)"],
        answer: 1,
        explanation: "正確，臺北榮總地址為臺北市北投區石牌路二段201號。"
      },
      {
        id: 2,
        region: "北北基",
        type: "選擇題",
        category: "地理環境",
        question: "忠孝東路 與 建國南路 交叉路口附近，主要的著名地標為何？",
        options: ["1. 國立臺北科技大學", "2. 臺北市政府", "3. 國父紀念館"],
        answer: 1,
        explanation: "忠孝東路與建國南路口主要著名地標為臺北科技大學（北科大）。"
      },
      {
        id: 3,
        region: "桃園",
        type: "是非題",
        category: "地理環境",
        question: "桃園國際機場第一航廈與第二航廈皆部位於桃園市大園區。",
        options: ["1. 對 (O)", "2. 錯 (X)"],
        answer: 1,
        explanation: "正確，桃園國際機場位於桃園市大園區。"
      },
      {
        id: 4,
        region: "桃園",
        type: "選擇題",
        category: "地理環境",
        question: "桃園火車站主要位於桃園市哪一個行政區？",
        options: ["1. 中壢區", "2. 桃園區", "3. 八德區"],
        answer: 2,
        explanation: "桃園火車站位於桃園區中正路。"
      },
      {
        id: 5,
        region: "宜蘭",
        type: "是非題",
        category: "地理環境",
        question: "國道五號雪山隧道連接新北市坪林區與宜蘭縣頭城鎮。",
        options: ["1. 對 (O)", "2. 錯 (X)"],
        answer: 1,
        explanation: "正確，雪山隧道北起坪林、南至頭城。"
      },
      {
        id: 6,
        region: "通用法規",
        type: "是非題",
        category: "交通法規",
        question: "計程車駕駛人受廢止執業登記處分者，自處分送達之日起 1 年內不得辦理執業登記。",
        options: ["1. 對 (O)", "2. 錯 (X)"],
        answer: 2,
        explanation: "錯誤，依規定受廢止執業登記處分者，3年內不得辦理執業登記。"
      },
      {
        id: 7,
        region: "通用法規",
        type: "選擇題",
        category: "交通法規",
        question: "計程車駕駛人任意拒載乘客或故意繞道行駛者，處新臺幣多少罰鍰？",
        options: ["1. 600~1,200元", "2. 1,200~2,400元", "3. 3,000~6,000元"],
        answer: 1,
        explanation: "依道路交通管理處罰條例，處新臺幣 600 元以上 1,200 元以下罰鍰。"
      }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let isPlaying = false;
    const synth = window.speechSynthesis;

    function filterQuestions() {
      const selectedRegion = document.getElementById('region-select').value;
      const selectedType = document.getElementById('type-select').value;

      currentQuestions = masterQuestionBank.filter(q => {
        const matchRegion = (selectedRegion === 'ALL') || (q.region === selectedRegion);
        const matchType = (selectedType === 'ALL') || (q.type === selectedType);
        return matchRegion && matchType;
      });

      currentIndex = 0;
      if (isPlaying) {
        isPlaying = false;
        synth.cancel();
        document.getElementById('play-btn').innerText = '▶ 自動朗讀';
        document.getElementById('play-btn').classList.remove('active');
      }
      renderQuestion();
    }

    function renderQuestion() {
      if (!currentQuestions || currentQuestions.length === 0) {
        document.getElementById('question').innerText = "此篩選條件下無題目！";
        document.getElementById('options').innerHTML = '';
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('progress-text').innerText = "0 / 0";
        return;
      }

      const q = currentQuestions[currentIndex];
      document.getElementById('question').innerText = q.question;
      document.getElementById('category-name').innerText = `分類：${q.category}`;
      document.getElementById('region-badge').innerText = q.region;
      document.getElementById('type-badge').innerText = q.type;
      document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
      
      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        if (idx + 1 === q.answer) li.classList.add('correct');
        li.innerText = opt;
        optionsEl.appendChild(li);
      });

      const expEl = document.getElementById('explanation');
      if (q.explanation) {
        expEl.style.display = 'block';
        expEl.innerText = `💡 解析：${q.explanation}`;
      } else {
        expEl.style.display = 'none';
      }
    }
function speakCurrentQuestion() {
  if (!isPlaying || currentQuestions.length === 0) return;
  
  // 清除前一次的語音播放
  synth.cancel();

  const q = currentQuestions[currentIndex];
  // 組合題目與選項朗讀文字
  let text = `${q.type}。${q.question}。`;
  q.options.forEach(opt => text += `${opt}。`);
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-TW';
  utterance.rate = 0.95; // 朗讀速度 (0.8~1.0 適合開車聽)

  // 當題目與選項唸完時
  utterance.onend = () => {
    if (!isPlaying) return;

    // 停頓 2 秒 (給司機思考時間)
    setTimeout(() => {
      if (!isPlaying) return;

      const ansText = `正確答案是：${q.options[q.answer - 1]}。${q.explanation || ''}`;
      const ansUtterance = new SpeechSynthesisUtterance(ansText);
      ansUtterance.lang = 'zh-TW';
      ansUtterance.rate = 0.95;
      
      // 當答案與解析唸完時
      ansUtterance.onend = () => {
        if (!isPlaying) return;

        // 停頓 2.5 秒後自動切換並播報下一題 (不需點按鈕)
        setTimeout(() => {
          if (isPlaying) {
            // 自動遞增題號
            if (currentIndex < currentQuestions.length - 1) {
              currentIndex++;
            } else {
              currentIndex = 0; // 播到最後一題時，自動循環回到第一題
            }
            
            renderQuestion();        // 刷新介面畫面
            speakCurrentQuestion();  // 自動接續朗讀下一題
          }
        }, 2500); 
      };
      
      synth.speak(ansUtterance);
    }, 2000); 
  };

  synth.speak(utterance);
}
    function togglePlay() {
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        isPlaying = false;
        synth.cancel();
        btn.innerText = '▶ 自動朗讀';
        btn.classList.remove('active');
      } else {
        isPlaying = true;
        btn.innerText = '⏸️ 暫停朗讀';
        btn.classList.add('active');
        speakCurrentQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestions.length === 0) return;
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      renderQuestion();
      if (isPlaying) speakCurrentQuestion();
    }

    function prevQuestion() {
      if (currentQuestions.length === 0) return;
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = currentQuestions.length - 1;
      }
      renderQuestion();
      if (isPlaying) speakCurrentQuestion();
    }

    function startSTT() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("您的瀏覽器不支援語音辨識功能！");
        return;
      }

      synth.cancel();
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      
      const sttBtn = document.getElementById('stt-btn');
      sttBtn.innerText = '🎙️ 聆聽中...';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        alert(`您說的是：${transcript}`);
        sttBtn.innerText = '🎙️ 語音答題';
      };

      recognition.onerror = () => {
        sttBtn.innerText = '🎙️ 語音答題';
      };

      recognition.start();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    window.addEventListener('DOMContentLoaded', () => {
      filterQuestions();
    });
  </script>
</body>
</html>
