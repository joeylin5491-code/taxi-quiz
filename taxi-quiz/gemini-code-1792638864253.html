<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計程車執登聽題寶</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; color: #f59e0b; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 6px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .badge {
      align-self: flex-start;
      background-color: #3b82f6;
      color: #fff;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .question-text {
      font-size: 1.3rem;
      line-height: 1.6;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f8fafc;
    }
    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .option-item {
      background-color: #334155;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      border: 2px solid transparent;
    }
    .option-item.correct { border-color: #22c55e; background-color: #064e3b; }
    .explanation {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #cbd5e1;
      border-left: 4px solid #f59e0b;
      margin-top: auto;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      background-color: #3b82f6;
      transition: background-color 0.2s;
    }
    button:active { opacity: 0.8; }
    button.secondary { background-color: #475569; }
    button.warning { background-color: #d97706; }
    button.active { background-color: #22c55e; }
  </style>
</head>
<body>

  <header>
    <h1>🚖 計程車執登聽題寶</h1>
    <div class="status-bar">
      <span id="category-name">分類：地理環境</span>
      <span id="progress-text">1 / 3</span>
    </div>
  </header>

  <div class="card">
    <div class="badge" id="category-badge">北部考區地理環境</div>
    <div class="question-text" id="question">題目載入中...</div>
    <ul class="options-list" id="options"></ul>
    <div class="explanation" id="explanation" style="display:none;"></div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="warning" id="play-btn" onclick="togglePlay()">▶ 自動朗讀</button>
      <button class="secondary" id="stt-btn" onclick="startSTT()">🎙️ 語音答題</button>
    </div>
    <div class="btn-group">
      <button class="secondary" onclick="prevQuestion()">⏮️ 上一題</button>
      <button onclick="nextQuestion()">下一題 ⏭️</button>
    </div>
  </div>

  <script>
    // 範例題庫 (包含法規與地理)
    const questions = [
      {
        id: 1,
        category: "地理環境",
        question: "臺北市「臺北榮民總醫院」位於哪一條路上？",
        options: ["1. 石牌路二段", "2. 中山北路六段", "3. 承德路七段"],
        answer: 1,
        explanation: "臺北榮總位於臺北市北投區石牌路二段 201 號。"
      },
      {
        id: 2,
        category: "地理環境",
        question: "忠孝東路 與 建國南路 交叉路口附近，主要的著名地標為何？",
        options: ["1. 國立臺北科技大學", "2. 臺北市政府", "3. 國父紀念館"],
        answer: 1,
        explanation: "忠孝東路與建國南路口主要著名地標為臺北科技大學（北科大）。"
      },
      {
        id: 3,
        category: "交通法規",
        question: "計程車駕駛人受廢止執業登記處分者，自處分送達之日起多久內不得辦理執業登記？",
        options: ["1. 1 年", "2. 3 年", "3. 5 年"],
        answer: 2,
        explanation: "依據計程車營運管理辦法，受廢止執業登記處分者，3年內不得辦理執業登記。"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    const synth = window.speechSynthesis;

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('question').innerText = q.question;
      document.getElementById('category-name').innerText = `分類：${q.category}`;
      document.getElementById('category-badge').innerText = q.category;
      document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questions.length}`;
      
      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        if (idx + 1 === q.answer) li.classList.add('correct');
        li.innerText = opt;
        optionsEl.appendChild(li);
      });

      const expEl = document.getElementById('explanation');
      if (q.explanation) {
        expEl.style.display = 'block';
        expEl.innerText = `💡 解析：${q.explanation}`;
      } else {
        expEl.style.display = 'none';
      }
    }

    function speakCurrentQuestion() {
      if (!isPlaying) return;
      synth.cancel();

      const q = questions[currentIndex];
      let text = `${q.question}。`;
      q.options.forEach(opt => text += `${opt}。`);
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.9; // 稍慢節奏適合聽題

      utterance.onend = () => {
        if (!isPlaying) return;
        // 停頓 2 秒後朗讀答案
        setTimeout(() => {
          if (!isPlaying) return;
          const ansText = `正確答案是：${q.options[q.answer - 1]}。${q.explanation || ''}`;
          const ansUtterance = new SpeechSynthesisUtterance(ansText);
          ansUtterance.lang = 'zh-TW';
          
          ansUtterance.onend = () => {
            if (!isPlaying) return;
            // 停頓 3 秒後自動切換下一題
            setTimeout(() => {
              if (isPlaying) {
                nextQuestion();
                speakCurrentQuestion();
              }
            }, 3000);
          };
          
          synth.speak(ansUtterance);
        }, 2000);
      };

      synth.speak(utterance);
    }

    function togglePlay() {
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        isPlaying = false;
        synth.cancel();
        btn.innerText = '▶ 自動朗讀';
        btn.classList.remove('active');
      } else {
        isPlaying = true;
        btn.innerText = '⏸️ 暫停朗讀';
        btn.classList.add('active');
        speakCurrentQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0; // 循環回到第一題
      }
      renderQuestion();
      if (isPlaying) speakCurrentQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = questions.length - 1;
      }
      renderQuestion();
      if (isPlaying) speakCurrentQuestion();
    }

    function startSTT() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("您的瀏覽器不支援語音辨識功能！");
        return;
      }

      synth.cancel();
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      
      const sttBtn = document.getElementById('stt-btn');
      sttBtn.innerText = '🎙️ 聆聽中...';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        alert(`您說的是：${transcript}`);
        sttBtn.innerText = '🎙️ 語音答題';
      };

      recognition.onerror = () => {
        sttBtn.innerText = '🎙️ 語音答題';
      };

      recognition.start();
    }

    // 註冊 Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // 初始化繪製
    renderQuestion();
  </script>
</body>
</html>
